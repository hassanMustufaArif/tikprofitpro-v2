    <script type="application/ld+json">
    {

          "name": "What is TikProfitPro?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TikProfitPro is a TikTok Shop research tool that tracks trending products, scores their virality, searches Alibaba and AliExpress for similar supplier listings, and calculates your profit margin after TikTok fees."
          }
        },
        {
          "@type": "Question",
          "name": "How do I find Alibaba suppliers for TikTok Shop products?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Click Suppliers on any trending product and TikProfitPro shows the top 3 Alibaba or AliExpress search results for it (Amazon is in beta), then estimates your margin after TikTok's referral fee and creator commission. Check each listing, order a sample and confirm specs with the supplier before buying in bulk."
          }
        },
        {
          "@type": "Question",
          "name": "How is TikTok Shop profit margin calculated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Profit = Selling Price minus product cost, shipping, TikTok's referral fee (6% for most US categories, 5% for select jewelry and pre-owned), creator commission and ad cost. In the US, payment processing is included in the referral fee, so there is no separate 2.9% charge. Margin = Profit divided by Selling Price."
          }
        },
        {
          "@type": "Question",
          "name": "How much does TikProfitPro cost?",
